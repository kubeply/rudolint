[package]
name = "rudolint-bench"
version.workspace = true
edition.workspace = true
description = "Benchmark harness support for rudolint"
license.workspace = true
repository.workspace = true

[dependencies]

[dev-dependencies]
criterion = { version = "5.0.0", package = "codspeed-criterion-compat" }
rudolint-config = { path = "../rudolint-config" }
rudolint-diagnostics = { path = "../rudolint-diagnostics" }
rudolint-dockerfile = { path = "../rudolint-dockerfile" }
rudolint-output = { path = "../rudolint-output" }
rudolint-rules = { path = "../rudolint-rules" }

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "lint"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "output"
harness = false

[[bench]]
name = "cli"
harness = false
