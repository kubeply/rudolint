[workspace]
members = [
    "crates/rudolint-bench",
    "crates/rudolint-buildkit",
    "crates/rudolint-cli",
    "crates/rudolint-config",
    "crates/rudolint-diagnostics",
    "crates/rudolint-dockerfile",
    "crates/rudolint-fix",
    "crates/rudolint-image",
    "crates/rudolint-lsp",
    "crates/rudolint-output",
    "crates/rudolint-policy",
    "crates/rudolint-rules",
    "crates/rudolint-settings",
    "crates/rudolint-shell",
    "crates/rudolint-source",
    "crates/rudolint-test",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "1.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kubeply/rudolint"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
clap = { version = "4.5.51", features = ["derive"] }
email_address = "0.2.9"
globset = "0.4.18"
ignore = "0.4.25"
insta = { version = "1.44.0", features = ["json"] }
jsonschema = { version = "0.46.5", default-features = false }
lsp-server = "0.8.0"
lsp-types = "0.97.0"
predicates = "3.1.3"
regex = "1.12.2"
rudolint-bench = { path = "crates/rudolint-bench" }
rudolint-buildkit = { path = "crates/rudolint-buildkit" }
rudolint-config = { path = "crates/rudolint-config" }
rudolint-diagnostics = { path = "crates/rudolint-diagnostics" }
rudolint-dockerfile = { path = "crates/rudolint-dockerfile" }
rudolint-fix = { path = "crates/rudolint-fix" }
rudolint-image = { path = "crates/rudolint-image" }
rudolint-lsp = { path = "crates/rudolint-lsp" }
rudolint-output = { path = "crates/rudolint-output" }
rudolint-policy = { path = "crates/rudolint-policy" }
rudolint-rules = { path = "crates/rudolint-rules" }
rudolint-settings = { path = "crates/rudolint-settings" }
rudolint-shell = { path = "crates/rudolint-shell" }
rudolint-source = { path = "crates/rudolint-source" }
rudolint-test = { path = "crates/rudolint-test" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
semver = "1.0.28"
spdx = "0.13.4"
tempfile = "3.23.0"
url = "2.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
