<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc"><title id="title">Dockerfile linter benchmark scenarios</title><desc id="desc">Mean benchmark time by tool and scenario.</desc><style>text { fill: #cbd5e1; font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }.small { fill: #94a3b8; font-size: 12px; font-weight: 500; }.title { fill: #e2e8f0; font-size: 26px; font-weight: 800; }</style><rect width="100%" height="100%" fill="#111827"/><text class="title" x="32" y="42">Benchmark scenarios</text><text class="small" x="32" y="64">Mean seconds. Lower is better.</text><text x="32" y="84" fill="#e2e8f0">Single small Dockerfile</text><text x="308" y="116" text-anchor="end">kubeply/rudolint</text><rect x="320" y="105" width="26.7" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="354.7" y="116">0.084s</text><text x="308" y="138" text-anchor="end">hadolint/hadolint</text><rect x="320" y="127" width="33.6" height="14" rx="2" fill="#64748b"/><text class="small" x="361.6" y="138">0.106s</text><text x="308" y="160" text-anchor="end">docker build --check</text><rect x="320" y="149" width="220.6" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="548.6" y="160">0.698s</text><text x="308" y="182" text-anchor="end">wharflab/tally</text><rect x="320" y="171" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="182">1.740s</text><text x="32" y="264" fill="#e2e8f0">Single BuildKit-heavy Dockerfile</text><text x="308" y="296" text-anchor="end">kubeply/rudolint</text><rect x="320" y="285" width="29.6" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="357.6" y="296">0.099s</text><text x="308" y="318" text-anchor="end">hadolint/hadolint</text><rect x="320" y="307" width="38.9" height="14" rx="2" fill="#64748b"/><text class="small" x="366.9" y="318">0.130s</text><text x="308" y="340" text-anchor="end">docker build --check</text><rect x="320" y="329" width="303.6" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="631.6" y="340">1.015s</text><text x="308" y="362" text-anchor="end">wharflab/tally</text><rect x="320" y="351" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="362">1.839s</text><text x="32" y="444" fill="#e2e8f0">Repository with 100 generated Dockerfiles</text><text x="308" y="476" text-anchor="end">kubeply/rudolint</text><rect x="320" y="465" width="3.7" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="331.7" y="476">0.172s</text><text x="308" y="498" text-anchor="end">hadolint/hadolint</text><rect x="320" y="487" width="6.1" height="14" rx="2" fill="#64748b"/><text class="small" x="334.1" y="498">0.283s</text><text x="308" y="520" text-anchor="end">wharflab/tally</text><rect x="320" y="509" width="222.5" height="14" rx="2" fill="#14b8a6"/><text class="small" x="550.5" y="520">10.285s</text><text x="308" y="542" text-anchor="end">docker build --check</text><rect x="320" y="531" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="542">25.422s</text><text x="32" y="624" fill="#e2e8f0">Repository with 1,000 generated Dockerfiles</text><text x="308" y="656" text-anchor="end">kubeply/rudolint</text><rect x="320" y="645" width="3.4" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="331.4" y="656">0.793s</text><text x="308" y="678" text-anchor="end">hadolint/hadolint</text><rect x="320" y="667" width="8.0" height="14" rx="2" fill="#64748b"/><text class="small" x="336.0" y="678">1.849s</text><text x="308" y="700" text-anchor="end">wharflab/tally</text><rect x="320" y="689" width="129.8" height="14" rx="2" fill="#14b8a6"/><text class="small" x="457.8" y="700">30.052s</text><text x="308" y="722" text-anchor="end">docker build --check</text><rect x="320" y="711" width="550.0" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="878.0" y="722">127.344s</text><text x="32" y="804" fill="#e2e8f0">JSON output for 100 generated Dockerfiles</text><text x="308" y="836" text-anchor="end">kubeply/rudolint</text><rect x="320" y="825" width="4.5" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="332.5" y="836">0.172s</text><text x="308" y="858" text-anchor="end">hadolint/hadolint</text><rect x="320" y="847" width="7.5" height="14" rx="2" fill="#64748b"/><text class="small" x="335.5" y="858">0.292s</text><text x="308" y="880" text-anchor="end">wharflab/tally</text><rect x="320" y="869" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="880">21.276s</text><text x="32" y="984" fill="#e2e8f0">SARIF output for 100 generated Dockerfiles</text><text x="308" y="1016" text-anchor="end">kubeply/rudolint</text><rect x="320" y="1005" width="4.2" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="332.2" y="1016">0.162s</text><text x="308" y="1038" text-anchor="end">hadolint/hadolint</text><rect x="320" y="1027" width="7.8" height="14" rx="2" fill="#64748b"/><text class="small" x="335.8" y="1038">0.300s</text><text x="308" y="1060" text-anchor="end">wharflab/tally</text><rect x="320" y="1049" width="550.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="1060">21.264s</text></svg>
