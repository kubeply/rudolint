<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc"><title id="title">Dockerfile linter benchmark scenarios</title><desc id="desc">Mean benchmark time by tool and scenario.</desc><style>text { fill: #cbd5e1; font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }.small { fill: #94a3b8; font-size: 12px; font-weight: 500; }.title { fill: #e2e8f0; font-size: 26px; font-weight: 800; }</style><rect width="100%" height="100%" fill="#111827"/><text class="title" x="32" y="42">Benchmark scenarios</text><text class="small" x="32" y="64">Mean seconds. Lower is better.</text><text x="32" y="84" fill="#e2e8f0">Single small Dockerfile</text><text x="208" y="116" text-anchor="end">rudolint</text><rect x="220" y="105" width="31.5" height="14" rx="2" fill="#8b5cf6"/><text class="small" x="259.5" y="116">0.084s</text><text x="208" y="138" text-anchor="end">hadolint</text><rect x="220" y="127" width="39.7" height="14" rx="2" fill="#64748b"/><text class="small" x="267.7" y="138">0.106s</text><text x="208" y="160" text-anchor="end">dockerfilelint</text><rect x="220" y="149" width="59.4" height="14" rx="2" fill="#f97316"/><text class="small" x="287.4" y="160">0.159s</text><text x="208" y="182" text-anchor="end">dockerfile-lint</text><rect x="220" y="171" width="74.2" height="14" rx="2" fill="#ef4444"/><text class="small" x="302.2" y="182">0.199s</text><text x="208" y="204" text-anchor="end">docker build --check</text><rect x="220" y="193" width="260.7" height="14" rx="2" fill="#0ea5e9"/><text class="small" x="488.7" y="204">0.698s</text><text x="208" y="226" text-anchor="end">tally</text><rect x="220" y="215" width="650.0" height="14" rx="2" fill="#14b8a6"/><text class="small" x="878.0" y="226">1.740s</text><text x="32" y="264" fill="#e2e8f0">Single BuildKit-heavy Dockerfile</text><text x="208" y="296" text-anchor="end">rudolint</text><rect x="220" y="285" width="