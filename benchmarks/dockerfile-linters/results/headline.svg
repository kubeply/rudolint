<svg xmlns="http://www.w3.org/2000/svg" width="980" height="318" viewBox="0 0 980 318" role="img" aria-labelledby="title desc">
  <title id="title">Dockerfile linter benchmark</title>
  <desc id="desc">Mean time to lint 1,000 generated Dockerfiles.</desc>
  <style>
    text { fill: #cbd5e1; font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #94a3b8; font-size: 14px; font-weight: 500; }
    .title { fill: #e2e8f0; font-size: 28px; font-weight: 800; }
  </style>
  <rect width="100%" height="100%" fill="#111827"/>
  <text class="title" x="32" y="42">Dockerfile linter performance</text>
  <text class="small" x="32" y="66">Linting 1,000 deterministic Dockerfiles. Lower is better.</text>
  <text x="316" y="94" text-anchor="end">kubeply/rudolint</text><rect x="330" y="78" width="3.1" height="24" rx="2" fill="#8b5cf6"/><text x="345.1" y="96">0.79s</text><text x="316" y="136" text-anchor="end">hadolint/hadolint</text><rect x="330" y="120" width="7.1" height="24" rx="2" fill="#64748b"/><text x="349.1" y="138">1.85s</text><text x="316" y="178" text-anchor="end">wharflab/tally</text><rect x="330" y="162" width="115.6" height="24" rx="2" fill="#14b8a6"/><text x="457.6" y="180">30.05s</text><text x="316" y="220" text-anchor="end">docker build --check</text><rect x="330" y="204" width="490.0" height="24" rx="2" fill="#0ea5e9"/><text x="832.0" y="222">127.34s</text>
  <text class="small" x="330" y="290">Generated with hyperfine, 5 runs, 2 warmup.</text>
</svg>
