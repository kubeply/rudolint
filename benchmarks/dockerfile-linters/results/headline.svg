<svg xmlns="http://www.w3.org/2000/svg" width="980" height="402" viewBox="0 0 980 402" role="img" aria-labelledby="title desc">
  <title id="title">Dockerfile linter benchmark</title>
  <desc id="desc">Mean time to lint 1,000 generated Dockerfiles.</desc>
  <style>
    text { fill: #cbd5e1; font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #94a3b8; font-size: 14px; font-weight: 500; }
    .title { fill: #e2e8f0; font-size: 28px; font-weight: 800; }
  </style>
  <rect width="100%" height="100%" fill="#111827"/>
  <text class="title" x="32" y="42">Dockerfile linter performance</text>
  <text class="small" x="32" y="66">Linting 1,000 deterministic Dockerfiles. Lower is better.</text>
  <text x="196" y="94" text-anchor="end">dockerfilelint</text><rect x="210" y="78" width="2.3" height="24" rx="2" fill="#f97316"/><text x="224.3" y="96">0.49s</text><text x="196" y="136" text-anchor="end">rudolint</text><rect x="210" y="120" width="3.8" height="24" rx="2" fill="#8b5cf6"/><text x="225.8" y="138">0.79s</text><text x="196" y="178" text-anchor="end">dockerfile-lint</text><rect x="210" y="162" width="4.3" height="24" rx="2" fill="#ef4444"/><text x="226.3" y="180">0.89s</text><text x="196" y="220" text-anchor="end">hadolint</text><rect x="210" y="204" width="8.9" height="24" rx="2" fill="#64748b"/><text x="230.9" y="222">1.85s</text><text x="196" y="262" text-anchor="end">tally</text><rect x="210" y="246" width="144.0" height="24" rx="2" fill="#14b8a6"/><text x="366.0" y="264">30.05s</text><text x="196" y="304" text-anchor="end">docker build --check</text><rect x="210" y="288" width="610.0" height="24" rx="2" fill="#0ea5e9"/><text x="832.0" y="306">127.34s</text>
  <text class="small" x="210" y="374">Generated with hyperfine, 5 runs, 2 warmup.</text>
</svg>
