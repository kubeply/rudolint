name: Dockerfile linter benchmarks

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of hyperfine measurement runs
        required: false
        default: "5"
      warmup:
        description: Number of hyperfine warmup runs
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-benchmarks:
    name: update external benchmark charts
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hyperfine

      - name: Run external benchmarks
        run: |
          python3 scripts/dockerfile-linter-bench.py run \
            --runs "${{ inputs.runs || '5' }}" \
            --warmup "${{ inputs.warmup || '5' }}"

      - name: Verify generated artifacts
        run: |
          python3 -m py_compile scripts/dockerfile-linter-bench.py
          git diff --check
          test -s benchmarks/dockerfile-linters/results/latest.json
          test -s benchmarks/dockerfile-linters/results/tool-versions.json
          test -s benchmarks/dockerfile-linters/results/headline.svg
          test -s benchmarks/dockerfile-linters/results/scenarios.svg

      - name: Commit updated benchmark artifacts
        run: |
          if git diff --quiet -- benchmarks/dockerfile-linters/results; then
            echo "No benchmark artifact changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/dockerfile-linters/results
          git commit -m "test: update dockerfile linter benchmarks"
          git push
