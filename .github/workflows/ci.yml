name: ci

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      run-oracle:
        description: Run ignored compatibility oracle tests
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  INSTA_UPDATE: "no"

jobs:
  quality:
    name: quality
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: raven-actions/actionlint@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --all-features --locked

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

  benchmark-smoke:
    name: benchmark smoke
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check benchmark support
        run: cargo check -p rudolint-bench --all-targets --locked

  oracle:
    name: compatibility oracle
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-oracle == 'true' }}
    env:
      RUDOLINT_ORACLE_BIN: hadolint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Explain oracle installation
        run: |
          echo "Oracle CI is intentionally manual until Hadolint installation is pinned."
          echo "Set RUDOLINT_ORACLE_BIN to a reproducible Hadolint binary before enforcing this job."
          exit 1

      - name: Run ignored oracle tests
        run: cargo test -p rudolint --test parity -- --ignored
