name: ci

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      run-oracle:
        description: Run ignored compatibility oracle tests
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  INSTA_UPDATE: "no"

jobs:
  changes:
    name: select ci scope
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_rust: ${{ steps.scope.outputs.run_rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CI scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" || -z "$BASE_SHA" ]]; then
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" || true)"
          if [[ -z "$merge_base" ]]; then
            merge_base="$BASE_SHA"
          fi

          changed_files="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          run_rust=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              docs/*|.github/*.md|*.md)
                ;;
              *)
                run_rust=true
                ;;
            esac
          done <<< "$changed_files"

          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: changes
    if: ${{ needs.changes.outputs.run_rust == 'true' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: raven-actions/actionlint@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --all-features --locked

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

  benchmark-smoke:
    name: benchmark smoke
    needs: changes
    if: ${{ needs.changes.outputs.run_rust == 'true' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check benchmark support
        run: cargo check -p rudolint-bench --all-targets --locked

  oracle:
    name: compatibility oracle
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['run-oracle'] == 'true' }}
    env:
      RUDOLINT_ORACLE_BIN: hadolint
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master as of 2026-05-16
        with:
          toolchain: 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Explain oracle installation
        run: |
          echo "Oracle CI is intentionally manual until Hadolint installation is pinned."
          echo "Set RUDOLINT_ORACLE_BIN to a reproducible Hadolint binary before enforcing this job."

      - name: Run ignored oracle tests
        run: cargo test -p rudolint --test parity -- --ignored

      - name: Fail until hadolint pinning is implemented
        if: ${{ always() }}
        run: |
          echo "Oracle job is intentionally failing until Hadolint installation is pinned."
          exit 1
