name: CodSpeed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codspeed.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/rudolint-bench/**"
      - "crates/rudolint-dockerfile/**"
      - "crates/rudolint-source/**"
      - "fixtures/corpus/**"
      - "fixtures/parser/**"
  pull_request:
    paths:
      - ".github/workflows/codspeed.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/rudolint-bench/**"
      - "crates/rudolint-dockerfile/**"
      - "crates/rudolint-source/**"
      - "fixtures/corpus/**"
      - "fixtures/parser/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked

      - name: Build the benchmark target(s)
        run: cargo codspeed build -p rudolint-bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run
